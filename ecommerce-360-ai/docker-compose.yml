services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_dev_password}
      POSTGRES_DB: ecommerce360
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d ecommerce360"]
      interval: 5s
      retries: 20
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://ecom:${POSTGRES_PASSWORD:-ecom_dev_password}@db:5432/ecommerce360
      AI_DATABASE_URL: postgresql+psycopg://ai_readonly:${AI_DB_PASSWORD:-ai_readonly_dev_pw}@db:5432/ecommerce360
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-ai_readonly_dev_pw}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  pgdata:
